apiVersion: v1
kind: Service
metadata:
  name: littlehorse
  namespace: littlehorse
spec:
  selector:
    app: littlehorse
  ports:
    - name: dashboard
      protocol: TCP
      port: 8080
      targetPort: dashboard
    - name: external
      protocol: TCP
      port: 2023
      targetPort: external
    - name: internal
      protocol: TCP
      port: 2024
      targetPort: internal
    - name: health
      protocol: TCP
      port: 1822
      targetPort: health
---
apiVersion: v1
kind: Service
metadata:
  name: littlehorse-host
  namespace: littlehorse
spec:
  type: NodePort
  selector:
    app: littlehorse
  ports:
    - name: external
      protocol: TCP
      port: 2023
      targetPort: external
      nodePort: 32023
    - name: dashboard
      protocol: TCP
      port: 8080
      targetPort: dashboard
      nodePort: 30080
