apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  namespace: littlehorse
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: littlehorse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.32.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 11434
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
          startupProbe:
            httpGet:
              path: /api/tags
              port: http
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/tags
              port: http
          readinessProbe:
            httpGet:
              path: /api/tags
              port: http
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ollama-data
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: littlehorse
spec:
  type: NodePort
  selector:
    app: ollama
  ports:
    - name: http
      protocol: TCP
      port: 11434
      targetPort: http
      nodePort: 31434
