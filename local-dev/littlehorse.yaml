apiVersion: apps/v1
kind: Deployment
metadata:
  name: littlehorse
  namespace: littlehorse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: littlehorse
  template:
    metadata:
      labels:
        app: littlehorse
    spec:
      containers:
        - name: littlehorse
          image: ghcr.io/littlehorse-enterprises/littlehorse/lh-standalone:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: LHS_LISTENERS
              value: EXTERNAL:2023,INTERNAL:2024
            - name: LHS_LISTENERS_PROTOCOL_MAP
              value: EXTERNAL:PLAIN,INTERNAL:PLAIN
            - name: LHS_ADVERTISED_LISTENERS
              value: EXTERNAL://localhost:2023,INTERNAL://littlehorse:2024
          ports:
            - name: dashboard
              containerPort: 8080
            - name: external
              containerPort: 2023
            - name: internal
              containerPort: 2024
            - name: health
              containerPort: 1822
          startupProbe:
            httpGet:
              path: /liveness
              port: health
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /liveness
              port: health
          readinessProbe:
            httpGet:
              path: /readiness
              port: health
