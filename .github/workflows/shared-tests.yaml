name: shared-tests

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: ""
      upload-artifacts:
        required: false
        type: boolean
        default: false
    outputs:
      version:
        description: The version used for the build
        value: ${{ jobs.tests.outputs.version }}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "25"

      - name: Get version
        id: get-version
        env:
          PROVIDED_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$PROVIDED_VERSION" ]; then
            version="$PROVIDED_VERSION"
          else
            version="$(sed -n 's/^version=//p' gradle.properties)"
          fi

          if [ -z "$version" ]; then
            echo "Unable to determine the project version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "ORG_GRADLE_PROJECT_version=$version" >> "$GITHUB_ENV"

      - name: Check
        run: ./gradlew check

  build:
    runs-on: ubuntu-latest
    needs: tests
    env:
      ORG_GRADLE_PROJECT_version: ${{ needs.tests.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "25"

      - name: Build JVM application
        run: ./gradlew -x check build

      - name: Upload JVM application
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-jar
          path: build/quarkus-app/

      - name: Build native application
        run: >-
          ./gradlew -x check build
          -Dquarkus.native.enabled=true
          -Dquarkus.package.runner-suffix=-run
          -Dquarkus.package.output-name=quarkus
          -Dquarkus.package.jar.enabled=false
          -Dquarkus.native.container-build=true
          -Dquarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25

      - name: Upload native application
        if: ${{ inputs.upload-artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: agent-native
          path: build/quarkus-run
