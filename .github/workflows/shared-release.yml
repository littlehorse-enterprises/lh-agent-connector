name: shared-release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      pre-release:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          PRE_RELEASE: ${{ inputs.pre-release }}
        run: |
          args=(
            release create "$RELEASE_TAG"
            --title "$RELEASE_VERSION"
            --generate-notes
            --verify-tag
            --repo "$GITHUB_REPOSITORY"
          )

          if [ "$PRE_RELEASE" = "true" ]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
