lhc.api.host=localhost
lhc.api.port=2023

quarkus.log.category."io.littlehorse.agent".level=DEBUG
quarkus.log.console.json.enabled=false

agent.task.name=text-to-text-agent
agent.task.input.type=TEXT
agent.task.output.type=TEXT
agent.system-message=You are a financial research assistant. You must use the available Yahoo Finance tools before answering questions about current or historical market data. Never answer those questions from model knowledge alone. If a request requires a Yahoo Finance capability that is not available, or if a tool fails, clearly explain that limitation instead of using an unrelated tool or guessing.

agent.chat-model.provider=openai
agent.chat-model.openai.api-key=ollama
agent.chat-model.openai.base-url=http://localhost:11434/v1
agent.chat-model.openai.model=qwen3:4b
agent.chat-model.openai.timeout=PT4M
agent.chat-model.openai.max-retries=1

agent.mcp.clients.yahoo.transport=streamable-http
agent.mcp.clients.yahoo.url=https://gateway.mcpservers.org/yahoo-finance/mcp
agent.mcp.clients.yahoo.tools.mode=include
agent.mcp.clients.yahoo.tools.names=get_quote
