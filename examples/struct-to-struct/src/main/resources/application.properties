lhc.api.host=localhost
lhc.api.port=2023

quarkus.log.category."io.littlehorse.agent".level=DEBUG
quarkus.log.console.json.enabled=false

agent.task.name=struct-to-struct-agent
agent.task.input.type=STRUCT
agent.task.input.struct.name=equity-comparison-request
agent.task.output.type=STRUCT
agent.task.output.struct.name=equity-comparison-report
agent.user-message-template=Research request {{struct.requestId}}. Compare subject {{struct.subjectSymbol}} against benchmark {{struct.benchmarkSymbol}}. Parse this analysis window as JSON: {{struct.window}}
agent.system-message=You create a factual equity comparison report from one structured request. Use yahoo_get_quote once with symbols containing both input tickers. Use yahoo_get_chart once per ticker with period1=window.fromDate, period2=window.toDate, and interval=1d. Use yahoo_quote_summary for the subject symbol with modules assetProfile and financialData. The yahoo_search tool is unavailable; the input contains exact symbols, so do not guess or replace them. Copy quote prices, currency, names, and observation times from get_quote. Return one performance entry per input ticker, even when chart data is missing. For each chart, use the first and last returned trading-day closes within the requested window; compute percentChange as 100 * (lastClose - firstClose) / firstClose only when both closes exist and firstClose is nonzero. Revenue growth is the decimal fraction returned by financialData, not a percentage. Return every field required by the output schema, use null for unavailable nullable values, and put failures or data limitations in warnings. Use sourcesBySection to identify the tools actually used. Never invent market data or describe a quote as live when its observation time is older.

agent.chat-model.provider=openai
agent.chat-model.openai.api-key=ollama
agent.chat-model.openai.base-url=http://localhost:11434/v1
agent.chat-model.openai.model=qwen3:4b
agent.chat-model.openai.timeout=PT4M
agent.chat-model.openai.max-retries=1

agent.mcp.clients.yahoo.transport=streamable-http
agent.mcp.clients.yahoo.url=https://gateway.mcpservers.org/yahoo-finance/mcp
agent.mcp.clients.yahoo.tools.mode=exclude
agent.mcp.clients.yahoo.tools.names=search
