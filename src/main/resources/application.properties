# quarkus
quarkus.http.port=9091
quarkus.smallrye-health.root-path=/
quarkus.log.console.json.enabled=false
quarkus.log.category."io.littlehorse.connector".level=DEBUG

# littlehorse extension
lhc.api.host=localhost
lhc.api.port=2023

# General-purpose agent persona (system message). Change without recompiling.
lhc.general.system-message=You are a helpful assistant. Answer concisely and accurately.

# redis (persistent chat memory store)
quarkus.redis.hosts=redis://localhost:6379

# langchain4j
quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-responses=true

# Select the active chat model provider: openai or ollama.
# Override at build/dev time, e.g. -Dquarkus.langchain4j.chat-model.provider=ollama
quarkus.langchain4j.chat-model.provider=openai

# langchain4j (OpenAI / GPT-5)
quarkus.langchain4j.openai.chat-model.model-name=gpt-5.4-mini
quarkus.langchain4j.openai.timeout=60s

# langchain4j (Ollama / Google Gemma)
quarkus.langchain4j.ollama.chat-model.model-name=gemma4
quarkus.langchain4j.ollama.timeout=60s

# MCP filesystem server (gives the agent file tools, restricted to the directory below).
# Requires Node.js; the server is fetched with npx on first run.
quarkus.langchain4j.mcp.filesystem.transport-type=stdio
quarkus.langchain4j.mcp.filesystem.command=npx,-y,@modelcontextprotocol/server-filesystem,${lhc.agent.workspace}
lhc.agent.workspace=${java.io.tmpdir}/lh-agent-workspace