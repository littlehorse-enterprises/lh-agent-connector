agent.chat-model.provider=anthropic
agent.chat-model.anthropic.model=claude-3
agent.chat-model.anthropic.api-key=test-api-key
agent.system-message=You are a test assistant.
agent.task.name=test-agent

quarkus.littlehorse.tasks.register.enabled=false
quarkus.littlehorse.tasks.start.enabled=false
quarkus.littlehorse.structs.register.enabled=false
quarkus.littlehorse.user-tasks.register.enabled=false

agent.mcp.clients.github.enabled=false
agent.mcp.clients.github.url=https://mcp.example.test/github
agent.mcp.clients.github.auth.type=bearer
agent.mcp.clients.github.auth.token=test-github-token
agent.mcp.clients.slack.enabled=false
agent.mcp.clients.slack.url=https://mcp.example.test/slack
agent.mcp.clients.yahoo.enabled=false
agent.mcp.clients.yahoo.url=https://mcp.example.test/yahoo
agent.mcp.clients."test-server".enabled=false
agent.mcp.clients."test-server".transport=streamable-http
agent.mcp.clients."test-server".url=https://mcp.example.test/mcp
agent.mcp.clients."test-server".auth.type=oauth2
agent.mcp.clients."test-server".auth.oidc-client=test-oauth
agent.mcp.clients."test-server".headers[0].name=X-Test
agent.mcp.clients."test-server".headers[0].value=test-header
agent.mcp.clients."test-server".headers[1].name=X-API-Key
agent.mcp.clients."test-server".headers[1].value=test-api-key
agent.mcp.clients."test-server".tools.mode=include
agent.mcp.clients."test-server".tools.names=lookup,create
agent.mcp.clients."test-server".tools.name-prefix=test_
agent.mcp.clients."test-server".tools.specification-mapping.lookup.name=search
agent.mcp.clients."test-server".tools.specification-mapping.lookup.description=Search test data.
